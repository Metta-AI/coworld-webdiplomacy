# Single-process mode avoids nginx's root-worker initgroups call with CAP_SETGID
# dropped. PHP still has its own worker pool; nginx is supervised by the adapter.
user root;
daemon off;
master_process off;
pid /run/webdip/nginx.pid;
error_log /run/webdip/logs/nginx.log warn;

events { worker_connections 1024; }
http {
    log_format gamemaster_timing '$msec $request_time $status';
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 1m;
    client_body_temp_path /run/webdip/nginx-body;
    fastcgi_temp_path /run/webdip/nginx-fastcgi;
    proxy_temp_path /run/webdip/nginx-proxy;

    upstream webdip_events { server unix:/run/webdip/sse.sock; }
    server {
        listen 8080;
        root /application;

        location ~ ^/(player|global|client/player|client/global)$ {
            proxy_pass http://127.0.0.1:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }
        location = /healthz {
            proxy_pass http://127.0.0.1:8082;
        }
        location = /api.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /application/api.php;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_pass 127.0.0.1:9000;
        }
        location = /gamemaster.php {
            access_log /run/webdip/logs/gamemaster-timing.log gamemaster_timing;
            allow 127.0.0.1;
            deny all;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /application/gamemaster.php;
            fastcgi_read_timeout 310s;
            fastcgi_pass 127.0.0.1:9000;
        }
        location = /map.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /application/map.php;
            fastcgi_pass 127.0.0.1:9000;
        }
        location = /gamefile.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /application/gamefile.php;
            fastcgi_pass 127.0.0.1:9000;
        }
        location = /events {
            proxy_pass http://webdip_events;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 3600s;
        }
        location ~ ^/cache/games/[0-9]+/[0-9]+/(game|status|history|messages)\.json$ {
            try_files $uri =404;
        }
        location = /variants/Classic/cache/variant.json { try_files $uri =404; }
        location / { return 404; }
    }
}
