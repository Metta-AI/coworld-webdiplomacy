[project]
name = "webdip-ide"
version = "0.1.0"
description = "Local web IDE and agent bridge for the webDiplomacy optimizer lab"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "jinja2>=3.1,<4",
    "mcp>=1.2,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
