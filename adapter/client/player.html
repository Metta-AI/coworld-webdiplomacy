<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <!-- A meta policy survives proxies which strip HTTP headers. The upstream bundle
     initializes analytics; no external scripts, telemetry, or forms may leave here. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; form-action 'none'; base-uri 'none'"
    />
    <title>webDiplomacy</title>
    <style>
      #play-help { position: fixed; right: 8px; bottom: 8px; z-index: 10001; max-width: 320px; padding: 10px; background: #fff3c4; color: #222; font: 14px sans-serif; border: 1px solid #735d28; border-radius: 6px; }
      #play-help button { float: right; margin-left: 12px; }
      #play-help p { margin: 8px 0 0; }
      #connection-status {
        position: fixed;
        bottom: 0;
        left: 0;
        z-index: 10000;
        background: #fff3c4;
        color: #222;
        padding: 6px;
        font: 14px sans-serif;
      }
      #connection-status:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <aside id="play-help" aria-label="How to play here">
      <button id="dismiss-help" aria-label="Dismiss help">×</button>
      <strong>How to play here</strong>
      <p>Ready ends your turn. After adjudication, use the New phase arrow to advance the board.</p>
      <p>Open press with the pen or P. For Support hold, click the supported province twice.</p>
    </aside>
    <div id="connection-status" role="status">Connecting to game…</div>
    <script src="shim.js"></script>
  </body>
</html>
