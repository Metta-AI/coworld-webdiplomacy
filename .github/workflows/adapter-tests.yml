name: Adapter tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aiohttp==3.12.15 pydantic==2.11.9
      - run: python -m unittest discover -s adapter -p 'test_*.py' -v
      - run: git clone https://github.com/kestasjk/webDiplomacy.git upstream && git -C upstream checkout "$(cat UPSTREAM_COMMIT)"
      - run: docker build -f adapter/Dockerfile -t webdiplomacy-hosted-test .
      - run: docker run --rm --cap-drop=ALL --security-opt=no-new-privileges -e WEBDIP_MODE=smoke webdiplomacy-hosted-test
      - run: docker run --rm --cap-drop=ALL --security-opt=no-new-privileges -e WEBDIP_MODE=tactics webdiplomacy-hosted-test
      - run: docker run --rm --cap-drop=ALL --security-opt=no-new-privileges -e WEBDIP_MODE=convoy webdiplomacy-hosted-test
