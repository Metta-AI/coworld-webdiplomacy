name: Adapter tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aiohttp==3.12.15 pydantic==2.11.9
      - run: python -m unittest discover -s adapter -p 'test_*.py' -v
