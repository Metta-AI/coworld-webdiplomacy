name: Adapter tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run python -m unittest discover -s adapter -p 'test_*.py' -v
      - run: uv run ruff check adapter players tools
      - run: uv run python -m unittest players.test_players -v
      - run: uv run python -m unittest players.test_bridge -v
      - run: uv run coworld build --version 0.7.9
      - run: docker build --platform linux/amd64 -t herald:local players/examples
      - run: >-
          uv run coworld run-episode dist/coworld_manifest.json herald:local
          --run /opt/.venv/bin/python --run=-m --run players.launcher
          --run /opt/.venv/bin/python --run /opt/herald_bot.py
          --variant classic-press-short --output-dir tmp/herald --timeout-seconds 120
      - run: uv run python -m tools.check_herald tmp/herald
      - run: uv run playwright install --with-deps chromium --only-shell
      - run: uv run python -m tools.check_browser coworld-webdiplomacy-game:latest
      - run: uv run python -m tools.check_browser_scenarios coworld-webdiplomacy-game:latest
      - run: uv run python -m tools.check_bridge coworld-webdiplomacy-game:latest
      - run: uv run python tools/check_boot.py coworld-webdiplomacy-game:latest
      - run: uv run python tools/check_boot.py coworld-webdiplomacy-game:latest --crash-service
      - run: uv run python -m tools.check_episode coworld-webdiplomacy-game:latest
      - run: docker run --rm --platform linux/amd64 --cap-drop=ALL --security-opt=no-new-privileges -e WEBDIP_MODE=smoke coworld-webdiplomacy-game:latest
      - run: docker run --rm --platform linux/amd64 --cap-drop=ALL --security-opt=no-new-privileges -e WEBDIP_MODE=tactics coworld-webdiplomacy-game:latest
      - run: docker run --rm --platform linux/amd64 --cap-drop=ALL --security-opt=no-new-privileges -e WEBDIP_MODE=convoy coworld-webdiplomacy-game:latest
      - run: uv run python -m tools.check_random coworld-webdiplomacy-game:latest
      - run: uv run python -m tools.check_legal_corners coworld-webdiplomacy-game:latest
      - run: uv run python -m tools.check_press coworld-webdiplomacy-game:latest
      - run: uv run python -m tools.check_compatibility coworld-webdiplomacy-game:latest
      - run: uv run coworld run-episode dist/coworld_manifest.json --output-dir tmp/episode --timeout-seconds 60
      - run: uv run python -m tools.check_replay tmp/episode/replay tmp/p5-*/replay.json tmp/p4-press-*/replay.json
      # Game container stdout is public by design (see README, Runtime). Never print
      # tmp/*/logs: run-episode player logs there hold private press.
      - name: Print public game logs on failure
        if: failure()
        run: |
          for log in tmp/*/game.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"; cat "$log"; echo "::endgroup::"
          done
  optimizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run ruff check optimizer
      - working-directory: optimizer/mixin
        run: python3 -m unittest discover -s tools/tests -v
      # The lab's own tests must pass after a user fills field_sets.json, so this check
      # of the shipped file lives here and not in tools/tests.
      - name: Shipped field_sets.json holds placeholders only
        working-directory: optimizer/mixin
        run: |
          python3 - <<'PY'
          import json
          sets = {k: v for k, v in json.load(open("field_sets.json")).items() if not k.startswith("_")}
          assert sets, "field_sets.json ships no example sets"
          real = [s["policy_ref"] for v in sets.values() for s in v["seats"] if not s["policy_ref"].startswith("<")]
          assert not real, f"field_sets.json ships real policy ids: {real}"
          PY
      # Includes the golden search test (334 recorded decisions, about a minute).
      - working-directory: optimizer/mixin
        run: >-
          uv run --no-project --python 3.12 --with "pydantic-ai-slim[openai]==2.54.0"
          python -m unittest discover -s players/castlereagh/tests -v
      - working-directory: optimizer/ide
        run: uv run --locked python -m unittest discover -s tests -v
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          optimizer/install.sh "$RUNNER_TEMP/webdip-optimizer" --harness claude-code
      - name: Installed lab has no unfilled placeholders
        run: |
          ! grep -rn '{{' "$RUNNER_TEMP/webdip-optimizer/games/webdiplomacy" --include='*.md'
      # What a cold start depends on: the files the skills and the IDE name, the wiring, a
      # record made from the template that the seed's validator accepts, and the lab's own
      # tests passing where a user will run them.
      - name: Installed optimizer is complete
        working-directory: ${{ runner.temp }}/webdip-optimizer
        run: |
          lab=games/webdiplomacy
          for file in open_levers.md closed_levers.md best_practices.md experiments/_template.md \
              tools/holds.py tools/board_counts.py tools/seat_rows.py tools/seat_log.py tools/batches.py \
              tools/run_ab.py skills/ide/SKILL.md; do
            test -f "$lab/$file" || { echo "missing $lab/$file"; exit 1; }
          done
          test -x ide/ide
          test "$(git ls-files -s ide/ide | cut -c1-6)" = 100755
          for link in ide press-audit opponent-profile matchup-writeup; do
            test -f ".claude/skills/webdiplomacy-$link/SKILL.md" || { echo "skill link $link is broken"; exit 1; }
          done
          python3 - <<'PY'
          import json
          hooks = json.load(open(".claude/settings.json"))["hooks"]
          waiters = sorted(event for event, entries in hooks.items()
                           if any(hook.get("asyncRewake") for entry in entries for hook in entry["hooks"]))
          assert waiters == ["FileChanged", "PostToolUse", "SessionStart", "Stop", "UserPromptSubmit"], waiters
          assert "SessionEnd" in hooks
          assert "webdip-ide" in json.load(open(".mcp.json"))["mcpServers"]
          PY
          python3 ide/ide status
          uv run skills/experiment/scripts/record.py new "$lab" ci-check
          uv run skills/experiment/scripts/record.py validate "$lab"
          (cd "$lab" && python3 -m unittest discover -s tools/tests)
          # The IDE's tests borrow the lab's helpers and templates: they must find them in an install too.
          (cd ide && uv run python -m unittest discover -s tests)
          # Nothing but the new record is left for git to pick up: no lock file, cache or virtualenv.
          test "$(git status --porcelain | wc -l)" -eq 1
