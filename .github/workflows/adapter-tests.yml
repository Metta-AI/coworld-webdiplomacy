name: Adapter tests
# Pull requests are tested as pull requests, so a branch push is not tested a second time.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Decides which of the slower jobs this change needs; tools/ci_scope.py holds the rules.
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.scope.outputs.images }}
      optimizer: ${{ steps.scope.outputs.optimizer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Explicit bash runs with pipefail: a failed script must fail the job, not skip the others.
        shell: bash
        run: python3 -m tools.ci_scope "$BASE" | tee -a "$GITHUB_OUTPUT"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run python -m unittest discover -s adapter -p 'test_*.py' -v
      - run: uv run ruff check adapter players tools
      - run: uv run python -m unittest players.test_players -v
      - run: uv run python -m unittest players.test_bridge -v
      - run: uv run python -m unittest tools.test_ci_scope -v
      - name: League Desk tests and lint
        working-directory: ops/league-desk
        run: |
          uv sync --locked --group dev
          uv run --locked python -m unittest discover -s tests -v
          uv run --locked ruff check league_desk tests
          node tests/tournament_check.mjs
  # Each group builds the images itself, from a shared layer cache, and runs on its own
  # runner. Checks that read another check's output are in the same group.
  image-checks:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    name: image checks (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: browser
            browser: true
            run: |
              uv run python -m tools.check_browser coworld-webdiplomacy-game:latest
          # check_replay reads the replays that the browser scenarios, the press check and
          # the certification episode leave under tmp/.
          - name: replay
            browser: true
            run: |
              uv run python -m tools.check_browser_scenarios coworld-webdiplomacy-game:latest
              uv run python -m tools.check_press coworld-webdiplomacy-game:latest
              uv run coworld run-episode dist/coworld_manifest.json --output-dir tmp/episode --timeout-seconds 60
              uv run python -m tools.check_replay tmp/episode/replay tmp/p5-*/replay.json tmp/p4-press-*/replay.json
          - name: episode
            run: |
              uv run python -m tools.check_episode coworld-webdiplomacy-game:latest
          - name: random
            run: |
              uv run python -m tools.check_random coworld-webdiplomacy-game:latest
          - name: orders
            run: |
              uv run python -m tools.check_legal_corners coworld-webdiplomacy-game:latest
              for mode in smoke tactics convoy; do
                docker run --rm --platform linux/amd64 --cap-drop=ALL --security-opt=no-new-privileges -e WEBDIP_MODE=$mode coworld-webdiplomacy-game:latest
              done
              uv run python -m tools.check_bridge coworld-webdiplomacy-game:latest
              uv run python tools/check_boot.py coworld-webdiplomacy-game:latest
              uv run python tools/check_boot.py coworld-webdiplomacy-game:latest --crash-service
          # The Herald image is built FROM the local player image, which only the Docker
          # daemon's own builder can see.
          - name: compatibility
            run: |
              uv run python -m tools.check_compatibility coworld-webdiplomacy-game:latest
              docker build --builder default --platform linux/amd64 -t herald:local players/examples
              uv run coworld run-episode dist/coworld_manifest.json herald:local \
                --run /opt/.venv/bin/python --run=-m --run players.launcher \
                --run /opt/.venv/bin/python --run /opt/herald_bot.py \
                --variant classic-press-short --output-dir tmp/herald --timeout-seconds 120
              uv run python -m tools.check_herald tmp/herald
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
          python-version: '3.12'
      - run: uv sync --locked --group dev
      # Restore the game image's layers from the GitHub Actions cache into this job's
      # builder, so that the builds `coworld build` and its replay viewer hook run next
      # reuse them. The two slow layers (apt packages, the upstream React build) change
      # only with the submodule or the base image. One group saves the cache.
      # `load` is what downloads the layers: without an output the cache hits stay
      # references that only a build with the same cache-from can use.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          source: .
          files: compose.yaml
          targets: game
          load: true
          set: |
            game.platform=linux/amd64
            game.cache-from=type=gha,scope=game
            ${{ matrix.name == 'episode' && 'game.cache-to=type=gha,scope=game,mode=max,ignore-error=true' || '' }}
      - run: uv run coworld build --version 0.7.19
      - if: matrix.browser
        run: uv run playwright install --with-deps chromium --only-shell
      - name: Run ${{ matrix.name }} checks
        shell: bash -ex {0}
        run: ${{ matrix.run }}
      # Game container stdout is public by design (see README, Runtime). Never print
      # tmp/*/logs: run-episode player logs there hold private press.
      - name: Print public game logs on failure
        if: failure()
        run: |
          for log in tmp/*/game.log; do
            [ -f "$log" ] || continue
            echo "::group::$log"; cat "$log"; echo "::endgroup::"
          done
  optimizer:
    needs: changes
    if: needs.changes.outputs.optimizer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run ruff check optimizer
      - working-directory: optimizer/mixin
        run: python3 -m unittest discover -s tools/tests -v
      # The lab's own tests must pass after a user fills field_sets.json, so this check
      # of the shipped file lives here and not in tools/tests.
      - name: Shipped field_sets.json holds placeholders only
        working-directory: optimizer/mixin
        run: |
          python3 - <<'PY'
          import json
          sets = {k: v for k, v in json.load(open("field_sets.json")).items() if not k.startswith("_")}
          assert sets, "field_sets.json ships no example sets"
          real = [s["policy_ref"] for v in sets.values() for s in v["seats"] if not s["policy_ref"].startswith("<")]
          assert not real, f"field_sets.json ships real policy ids: {real}"
          PY
      # Includes the golden search test (334 recorded decisions, about a minute).
      - working-directory: optimizer/mixin
        run: >-
          uv run --no-project --python 3.12 --with "pydantic-ai-slim[openai]==2.54.0"
          python -m unittest discover -s players/castlereagh/tests -v
      - working-directory: optimizer/ide
        run: uv run --locked python -m unittest discover -s tests -v
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          optimizer/install.sh "$RUNNER_TEMP/webdip-optimizer" --harness claude-code
      - name: Installed lab has no unfilled placeholders
        run: |
          ! grep -rn '{{' "$RUNNER_TEMP/webdip-optimizer/games/webdiplomacy" --include='*.md'
      # What a cold start depends on: the files the skills and the IDE name, the wiring, a
      # record made from the template that the seed's validator accepts, and the lab's own
      # tests passing where a user will run them.
      - name: Installed optimizer is complete
        working-directory: ${{ runner.temp }}/webdip-optimizer
        run: |
          lab=games/webdiplomacy
          for file in open_levers.md closed_levers.md best_practices.md experiments/_template.md \
              tools/holds.py tools/board_counts.py tools/seat_rows.py tools/seat_log.py tools/batches.py \
              tools/run_ab.py tools/check_coworld.py CHANGELOG.md skills/ide/SKILL.md; do
            test -f "$lab/$file" || { echo "missing $lab/$file"; exit 1; }
          done
          test -x ide/ide
          test "$(git ls-files -s ide/ide | cut -c1-6)" = 100755
          for link in ide press-audit opponent-profile matchup-writeup; do
            test -f ".claude/skills/webdiplomacy-$link/SKILL.md" || { echo "skill link $link is broken"; exit 1; }
          done
          python3 - <<'PY'
          import json
          hooks = json.load(open(".claude/settings.json"))["hooks"]
          waiters = sorted(event for event, entries in hooks.items()
                           if any(hook.get("asyncRewake") for entry in entries for hook in entry["hooks"]))
          assert waiters == ["FileChanged", "PostToolUse", "SessionStart", "Stop", "UserPromptSubmit"], waiters
          assert "SessionEnd" in hooks
          assert "webdip-ide" in json.load(open(".mcp.json"))["mcpServers"]
          PY
          python3 ide/ide status
          uv run skills/experiment/scripts/record.py new "$lab" ci-check
          uv run skills/experiment/scripts/record.py validate "$lab"
          (cd "$lab" && python3 -m unittest discover -s tools/tests)
          # The IDE's tests borrow the lab's helpers and templates: they must find them in an install too.
          (cd ide && uv run python -m unittest discover -s tests)
          # Nothing but the new record is left for git to pick up: no lock file, cache or virtualenv.
          test "$(git status --porcelain | wc -l)" -eq 1
