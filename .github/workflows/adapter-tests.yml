name: Adapter tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.8'
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run python -m unittest discover -s adapter -p 'test_*.py' -v
      - run: uv run ruff check adapter/boot.py adapter/supervisor.py tools/check_boot.py
      - run: docker build --platform linux/amd64 -f adapter/Dockerfile -t webdiplomacy-hosted-test .
      - run: uv run python tools/check_boot.py webdiplomacy-hosted-test
      - run: uv run python tools/check_boot.py webdiplomacy-hosted-test --crash-service
      # The smoke/tactics/convoy scenario sources are retained; restore these image
      # modes after they use the supervised gamemaster and per-episode users.
