[project]
name = "league-desk"
version = "0.1.0"
description = "Local read-only webDiplomacy league operations page"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "jinja2>=3.1,<4",
    "coworld[auth]==0.1.58",
    "softmax-cli==0.26.38",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
